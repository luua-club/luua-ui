<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="prefetch" as="image" href="/images/autogen.webp" />
    <link rel="prefetch" as="image" href="/images/create.webp" />
    <link rel="prefetch" as="image" href="/images/summary.webp" />
    <link rel="prefetch" as="image" href="/images/social.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luua</title>
  </head>
  <body>
    <div id="root">
      <style>
        #app-loader {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 24px;
          background: hsl(0 0% 100%);
          opacity: 1;
          transition: opacity 0.4s ease-out;
          pointer-events: none;
        }
        #app-loader.fade-out {
          opacity: 0;
        }
        .dark-loader #app-loader {
          background: hsl(240 10% 3.9%);
        }
        .loader-logo {
          font-size: 20px;
          font-weight: 700;
          color: hsl(240 10% 3.9%);
          animation: fadeIn 0.6s ease-out;
          font-family:
            ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji',
            'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
        }
        .dark-loader .loader-logo {
          color: hsl(0 0% 98%);
        }
        .loader-spinner {
          display: flex;
          gap: 6px;
          animation: fadeIn 0.6s ease-out 0.2s backwards;
        }
        .loader-dot {
          width: 4px;
          height: 4px;
          border-radius: 50%;
          background: hsl(240 5.9% 10%);
          animation: bounce 1.4s ease-in-out infinite;
        }
        .dark-loader .loader-dot {
          background: hsl(0 0% 98%);
        }
        .loader-dot:nth-child(1) {
          animation-delay: 0s;
        }
        .loader-dot:nth-child(2) {
          animation-delay: 0.2s;
        }
        .loader-dot:nth-child(3) {
          animation-delay: 0.4s;
        }
        @keyframes bounce {
          0%,
          80%,
          100% {
            transform: scale(0);
            opacity: 0.5;
          }
          40% {
            transform: scale(1);
            opacity: 1;
          }
        }
        @keyframes fadeIn {
          from {
            opacity: 0;
            transform: translateY(-10px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      </style>
      <script>
        // Apply theme from localStorage before render
        ;(function () {
          const theme = localStorage.getItem('vite-ui-theme')
          const systemTheme = window.matchMedia('(prefers-color-scheme: dark)')
            .matches
            ? 'dark'
            : 'light'
          const activeTheme = theme || systemTheme

          if (activeTheme === 'dark') {
            document.documentElement.classList.add('dark-loader')
          }
        })()
      </script>
      <div id="app-loader">
        <div class="loader-logo">Luua</div>
        <div class="loader-spinner">
          <div class="loader-dot"></div>
          <div class="loader-dot"></div>
          <div class="loader-dot"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
